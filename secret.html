<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#010818">
  <title>Something from me</title><link rel="stylesheet" href="css/style.css">
  <style>
    .secret-page{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 43%,#031435 0,#020e24 48%,#010818 78%);color:#d5d5d5}
    .secret-card{width:min(560px,100%);padding:30px;border:1px solid rgba(213,213,213,.15);border-radius:12px;background:#020e24ee;box-shadow:0 25px 80px rgba(0,0,0,.5);color:#d5d5d5}
    .secret-tree{position:relative;width:150px;height:190px;margin:8px auto 22px;animation:sway 3.5s ease-in-out infinite alternate;transform-origin:50% 100%}
    .secret-tree .tier{position:absolute;left:50%;width:0;height:0;border-left:var(--w) solid transparent;border-right:var(--w) solid transparent;border-bottom:var(--h) solid #557a66;transform:translateX(-50%);filter:drop-shadow(0 6px 8px #0005)}
    .secret-tree .tier:nth-child(1){--w:24px;--h:42px;top:12px}.secret-tree .tier:nth-child(2){--w:42px;--h:54px;top:39px;border-bottom-color:#446b59}.secret-tree .tier:nth-child(3){--w:61px;--h:66px;top:71px;border-bottom-color:#365846}
    .secret-tree .trunk{position:absolute;left:67px;bottom:0;width:17px;height:34px;background:#765644;border-radius:2px}
    .secret-tree b{position:absolute;color:#f2ce86;font-size:13px;text-shadow:0 0 10px #f3d38c;animation:glint 1.7s ease-in-out infinite alternate}.secret-tree b:nth-of-type(1){top:56px;left:71px}.secret-tree b:nth-of-type(2){top:103px;left:40px;animation-delay:.4s}.secret-tree b:nth-of-type(3){top:117px;right:36px;animation-delay:.8s}.secret-tree b:nth-of-type(4){top:150px;left:76px;animation-delay:1.1s}
    @keyframes sway{to{transform:rotate(2deg)}}@keyframes glint{to{opacity:.35;transform:scale(.75)}}
    .secret-card h1{font-size:clamp(38px,8vw,62px);line-height:1.03;margin:10px 0}.secret-card h1 em{color:var(--amber)}.secret-card p:not(.eyebrow){color:var(--muted);font-size:13px;line-height:1.7}.secret-card .secondary-button{margin:20px auto 0;min-width:140px}
    .secret-ps{position:fixed;right:16px;bottom:12px;margin:0;color:#8c98ac;font:9px/1.4 var(--mono);letter-spacing:.02em;opacity:.68}
    @media(max-width:540px){.secret-ps{left:10px;bottom:8px;font-size:8px}}
  </style>
</head>
<body><main class="secret-page"><section class="secret-card"><p class="eyebrow">YOU HAVE FOUND THE SECRET</p><div class="secret-tree" role="img" aria-label="A softly swaying little evergreen tree with twinkling lights"><i class="tier"></i><i class="tier"></i><i class="tier"></i><i class="trunk"></i><b>✦</b><b>✧</b><b>✦</b><b>✧</b></div><h1>Happy<br><em>Christmas</em></h1><p>with deadlines though</p><a class="secondary-button" href="index.html">Back to main</a></section></main><p class="secret-ps">text me, ok?</p></body>
</html>
